# Enable mouse support
set -g mouse on

# For vi/tmux d/y buffer sync
set -g focus-events on

# vi keys for copy mode
setw -g mode-keys vi

# vi keys for command status
set -g status-keys vi

# Automatically renumber windows
set -g renumber-windows on

# Press the prefix twice (C-b C-b) to toggle last window
bind-key C-b last-window

bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded!"

# Turn pane sync on/off
bind y setw synchronize-panes

# Kill pane without confirmation
bind-key x kill-pane

# Kill window without confirmation
bind-key & kill-window

# Better window names
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Use vi keys to navigate panes
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Shorter repeat window for repeatable binds (default 500ms)
set -g repeat-time 300

# Use vi keys to resize panes
bind -r C-k resize-pane -U 1
bind -r C-j resize-pane -D 1
bind -r C-h resize-pane -L 1
bind -r C-l resize-pane -R 1

# Set default terminal and 256 colors
set -g default-terminal "tmux-256color"

set-option -g default-shell /usr/bin/fish

# Start index with 1
set -g base-index 1
set -g pane-base-index 1

# Minimal status bar
set -g status-left ""
set -g status-right ""
if-shell "command -v pomo >/dev/null 2>&1" 'set -g status-right "#(pomo)"'
set -g status-position top
set -g status-style "bg=default,fg=#7c6f64"

set -g status-interval 1

# Modern truecolor for foot (replaces the Tc override)
set -as terminal-features 'foot*:RGB:extkeys'

# No delay after Esc (matters for vi mode and Claude's Esc-to-interrupt)
set -sg escape-time 0

# From Anthropic's terminal configuration docs (Claude Code 2.1.312)
set -s extended-keys on

# Forward escape sequences/notifications from agents in background windows too
set -g allow-passthrough all

# Long agent runs produce a lot of output (default is 2000 lines)
set -g history-limit 50000

# Show which window finished/needs attention
set -g monitor-bell on
set -g visual-bell off
set -g window-status-bell-style "fg=#fb4934,bold"

# Quick popup shell for one-off commands without leaving Claude's pane
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" fish

# Jump to a window by fuzzy picker
bind w choose-tree -Zw

# Copy to Wayland clipboard on yank
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi v send -X begin-selection
