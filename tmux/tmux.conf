# General
set -g mouse on
set -g mode-keys vi
set -g status-keys vi

# Pass focus in/out to apps (Vim autoread, FocusGained)
set -g focus-events on

# Short Esc delay, explicit so it is the same on every version
# (tmux < 3.5 defaults to 500ms, which makes Esc in Vim feel laggy)
set -s escape-time 10

# Windows and panes: name after the directory, open new ones in it
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
set -g automatic-rename-format '#{b:pane_current_path}'

# Terminal: tmux-256color when its terminfo exists, otherwise fall back (e.g. macOS)
if-shell "infocmp tmux-256color >/dev/null 2>&1" \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Truecolor and extended keys (e.g. Shift+Enter in Claude Code) for foot
set -as terminal-features 'foot*:RGB:extkeys'
set -s extended-keys on

# Clipboard: OSC 52 to the outer terminal (works over SSH, any OS), and
# wl-copy when available. Default keys: Space to select, Enter to copy
set -s set-clipboard on
if-shell "command -v wl-copy >/dev/null 2>&1" 'set -s copy-command "wl-copy"'

# Status bar: minimal, at the top, pomo timer when installed
set -g status-position top
set -g status-style "bg=default,fg=#7c6f64"
set -g status-left ""
set -g status-right ""
if-shell "command -v pomo >/dev/null 2>&1" \
  'set -g status-right "#(pomo status --tmux)"; set -g status-interval 1'
