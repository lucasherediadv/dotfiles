# Enable mouse support
set -g mouse on

# For vi/tmux d/y buffer sync
set -g focus-events on

# vi keys for copy mode
setw -g mode-keys vi

# vi keys for command status
set -g status-keys vi

# Automatically renumber windows
set -g renumber-windows on

# Add double-tap meta key to toggle last window
bind-key C-b last-window

bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded!"

# Better window names
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Use vi keys to navigate panes
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Use vi keys to resize panes
bind -r C-k resize-pane -U 1
bind -r C-j resize-pane -D 1
bind -r C-h resize-pane -L 1
bind -r C-l resize-pane -R 1

# Set default terminal and 256 colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",foot:Tc"

set-option -g default-shell /usr/bin/fish

# Start index with 1
set -g base-index 1
set -g pane-base-index 1

# Minimal status bar
set -g status-left ""
set -g status-right ""
set -g status-position top
set -g status-style "bg=default,fg=#7c6f64"
